name: desktop

# Builds the self-contained Windows installer (MSI): Yusr + PostgreSQL + llama.cpp + system DLLs + web interface.
# The heavy local AI/ML model is excluded from the build artifact and release asset (< 150 MB),
# and is downloaded on-demand by the end-user post-installation. Tags matching v* also publish it as a release asset.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "app/**"
      - "crates/**"
      - "web/**"
      - "migrations/**"
      - "packaging/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msi:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            app/src-tauri -> target

      - name: Cache web build
        id: cache-web
        uses: actions/cache@v4
        with:
          path: web/dist
          key: web-dist-${{ hashFiles('web/src/**', 'web/package-lock.json', 'web/vite.config.ts') }}

      - name: Build the web interface
        if: steps.cache-web.outputs.cache-hit != 'true'
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Cache downloads & bundled resources (Resumable)
        uses: actions/cache@v4
        with:
          path: |
            app/.downloads
            app/resources
          key: resources-selfcontained-${{ runner.os }}-${{ hashFiles('app/scripts/fetch-resources.ps1') }}
          restore-keys: |
            resources-selfcontained-${{ runner.os }}-
            resources-${{ runner.os }}-

      - name: Fetch bundled resources (excluding heavy local model)
        shell: pwsh
        run: ./app/scripts/fetch-resources.ps1 -NoModel

      - name: Launcher against the bundled PostgreSQL
        shell: pwsh
        run: |
          $env:YUSR_TEST_PG_BIN = "$PWD\app\resources\postgresql\bin"
          $env:PATH = "$PWD\app\resources\postgresql\bin;$env:PATH"
          cargo test --release -p yusr-launcher -- --ignored

      - name: Smoke test of the packaged layout (database, server; on-demand model)
        run: cargo run --release -p yusr-launcher --example smoke -- app/resources --no-model

      - name: Build the MSI
        working-directory: app
        run: npx --yes @tauri-apps/cli@2.12.4 build --bundles msi

      - name: Check the installer
        shell: pwsh
        run: |
          $msi = Get-ChildItem app/src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          if (-not $msi) { throw 'no MSI produced' }
          # Without the heavy model, package size should be around 100-200 MB.
          if ($msi.Length -ge 1GB) { throw "MSI is $($msi.Length) bytes, over the 1 GB limit: model should not be bundled" }
          "{0} {1:N0} MB" -f $msi.Name, ($msi.Length / 1MB)
          (Get-FileHash $msi -Algorithm SHA256).Hash | Out-File -Encoding ascii "$($msi.FullName).sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: yusr-windows-msi
          path: |
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/msi/*.sha256
          retention-days: 30
          compression-level: 0

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Yusr (يُسر) v0.2.0 — Sovereign Offline Fund Accounting Suite"
          body_path: RELEASE_NOTES.md
          files: |
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/msi/*.sha256

  deb:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            app/src-tauri -> target

      - name: Build web interface
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Prepare resources
        run: |
          mkdir -p app/resources/postgresql app/resources/llama app/resources/models app/resources/web
          cp -r web/dist/* app/resources/web/

      - name: Build Debian package
        working-directory: app
        run: npx --yes @tauri-apps/cli@2.12.4 build --bundles deb

      - name: Generate deb checksum
        shell: bash
        run: |
          cd app/src-tauri/target/release/bundle/deb
          deb_file=$(ls *.deb | head -n 1)
          sha256sum "$deb_file" > "$deb_file.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: yusr-linux-deb
          path: |
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/deb/*.sha256
          retention-days: 30

      - name: Publish deb to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/deb/*.sha256
