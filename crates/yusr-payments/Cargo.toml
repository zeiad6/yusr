[package]
name = "yusr-payments"
description = "Pluggable regional payment gateway adapters for Yusr (Tap, Moyasar, Fawry)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["tap", "moyasar", "fawry"]
# KNET (Kuwait), Benefit (Bahrain), mada, Apple Pay, Visa/Mastercard through Tap Payments.
tap = []
# mada, Apple Pay, Visa/Mastercard (Saudi Arabia) through Moyasar hosted invoices.
moyasar = []
# Pay-at-Fawry reference codes for retail cash and wallets (Egypt).
fawry = []

[dependencies]
yusr-domain.workspace = true
async-trait.workspace = true
hex.workspace = true
hmac.workspace = true
reqwest.workspace = true
rust_decimal.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
rust_decimal_macros.workspace = true
