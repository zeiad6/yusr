[package]
name = "yusr-server"
description = "Headless Axum REST server for Yusr with Argon2id passwords, JWT sessions and RBAC."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "yusr-server"
path = "src/main.rs"

[dependencies]
yusr-domain.workspace = true
yusr-infra.workspace = true
yusr-payments.workspace = true
argon2 = { version = "0.5", features = ["std"] }
axum.workspace = true
base64.workspace = true
chrono.workspace = true
hmac.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3", default-features = false }
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http = { version = "0.6", features = ["fs", "trace", "limit", "set-header", "catch-panic", "timeout"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
