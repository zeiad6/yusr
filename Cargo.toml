[workspace]
resolver = "2"
members = [
    "crates/yusr-domain",
    "crates/yusr-infra",
    "crates/yusr-payments",
    "crates/yusr-server",
    "crates/yusr-launcher",
]
# The Tauri shell lives in its own workspace (app/src-tauri) so the core can be
# built and tested on hosts without WebKitGTK; yusr-launcher holds everything it does.

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license-file = "LICENSE"
repository = "https://github.com/zeiad6/yusr"
authors = ["ZeidexSoft <info@zeidexsoft.com>"]

[workspace.dependencies]
yusr-domain = { path = "crates/yusr-domain" }
yusr-infra = { path = "crates/yusr-infra" }
yusr-payments = { path = "crates/yusr-payments" }
yusr-server = { path = "crates/yusr-server" }
yusr-launcher = { path = "crates/yusr-launcher" }

async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "multipart"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
hex = "0.4"
hmac = "0.12"
k256 = { version = "0.13", features = ["ecdsa", "sha256", "pkcs8", "pem"] }
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rust_decimal = { version = "1", features = ["serde-with-str", "maths"] }
rust_decimal_macros = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "chrono", "rust_decimal", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
