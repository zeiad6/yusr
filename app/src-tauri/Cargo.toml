[package]
name = "yusr-desktop"
description = "Yusr for Windows: a self-contained desktop app with its own database and local advisor model."
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license-file = "../../LICENSE"
authors = ["ZeidexSoft <info@zeidexsoft.com>"]
publish = false

# Its own workspace: Tauri needs WebView2/WebKitGTK, which the core crates must build without.
[workspace]

[lib]
name = "yusr_desktop_lib"
crate-type = ["rlib"]

[features]
# The installer without the bundled model: it is downloaded, started and stopped from Settings.
lite = []

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
yusr-launcher = { path = "../../crates/yusr-launcher" }
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2.5"
dunce = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
