<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>يُسر</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; font-family: "Segoe UI", Tahoma, sans-serif;
        background: radial-gradient(circle at 30% 20%, #0f6660, #08322f 70%); color: #fff8e6;
      }
      main { text-align: center; max-width: 560px; padding: 24px; }
      img { width: 112px; height: 112px; filter: drop-shadow(0 12px 30px rgba(0,0,0,.35)); }
      h1 { margin: 18px 0 4px; font-size: 26px; }
      p { margin: 6px 0; }
      .bar { width: 220px; height: 4px; margin: 22px auto 0; border-radius: 4px; background: rgba(255,255,255,.15); overflow: hidden; }
      .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #e6c36f; animation: slide 1.2s ease-in-out infinite; }
      @keyframes slide { from { transform: translateX(160%); } to { transform: translateX(-260%); } }
      #error { display: none; margin-top: 20px; padding: 14px; border-radius: 10px; background: rgba(0,0,0,.35); text-align: start; white-space: pre-wrap; font-size: 13px; direction: ltr; }
      @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <img src="logo.svg" alt="" />
      <h1>يُسر</h1>
      <p>نظام محاسبة وإدارة الجمعيات الخيرية</p>
      <p id="status">جارٍ تشغيل قاعدة البيانات والخادم والمستشار المحلي…</p>
      <div class="bar" id="bar"></div>
      <div id="error"></div>

      <div id="lan-client-box" style="margin-top: 25px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.15); font-size: 13px;">
        <button id="toggle-client-btn" type="button" style="background: rgba(255,255,255,0.12); color: #fff8e6; border: 1px solid rgba(255,255,255,0.25); border-radius: 6px; padding: 6px 14px; cursor: pointer; font-family: inherit; transition: background 0.2s;">
          🌐 وضع العميل: الاتصال بخادم الشبكة المحلية (LAN)
        </button>
        <div id="client-form" style="display: none; margin-top: 12px;">
          <input type="text" id="host-ip-input" placeholder="http://192.168.1.100:8000" style="padding: 8px 12px; border-radius: 6px; border: 1px solid #e6c36f; background: rgba(0,0,0,0.4); color: #fff; width: 240px; text-align: center; font-family: monospace;" />
          <br />
          <button id="connect-host-btn" type="button" style="background: #e6c36f; color: #08322f; font-weight: bold; border: none; border-radius: 6px; padding: 8px 18px; cursor: pointer; font-family: inherit; margin-top: 8px;">
            اتصال بالخادم
          </button>
        </div>
      </div>
    </main>
    <script>
      (function() {
        var savedHost = localStorage.getItem("yusr_lan_host_url");
        if (savedHost && !window.location.hash.includes("reset-host")) {
          document.getElementById("status").textContent = "جارٍ الاتصال بخادم الشبكة: " + savedHost + " …";
          window.location.href = savedHost;
          return;
        }

        var toggleBtn = document.getElementById("toggle-client-btn");
        var clientForm = document.getElementById("client-form");
        var hostInput = document.getElementById("host-ip-input");
        var connectBtn = document.getElementById("connect-host-btn");

        toggleBtn.addEventListener("click", function() {
          var isHidden = clientForm.style.display === "none";
          clientForm.style.display = isHidden ? "block" : "none";
          if (isHidden) hostInput.focus();
        });

        connectBtn.addEventListener("click", function() {
          var val = hostInput.value.trim();
          if (!val) return;
          if (!val.startsWith("http://") && !val.startsWith("https://")) {
            val = "http://" + val;
          }
          localStorage.setItem("yusr_lan_host_url", val);
          window.location.href = val;
        });
      })();

      window.showError = function (message) {
        document.getElementById("bar").style.display = "none";
        document.getElementById("status").textContent = "تعذّر تشغيل يُسر. السجلات في مجلد البيانات (logs).";
        var box = document.getElementById("error");
        box.style.display = "block";
        box.textContent = message;
      };
    </script>
  </body>
</html>
